name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: node scripts/release/scan-public-tree.mjs
      # タグと manifest の版は同じ量である。食い違ったまま publish しない
      - name: Tag must match the manifest version
        run: |
          set -euo pipefail
          v=$(node -p "require('./packages/extension/package.json').version")
          test "$GITHUB_REF" = "refs/tags/v$v" || { echo "tag $GITHUB_REF != manifest v$v" >&2; exit 1; }
      - run: npm run build
      - run: npm run -w packages/extension package
      # 束ねた第三者パッケージの表示が配布物に入っていること（MIT / ISC / BSD の条件）。
      # 一覧は esbuild.mjs が束ねた中身から生成し、許可外のライセンスならビルドが止まる
      - name: VSIX carries THIRD-PARTY-NOTICES.txt
        run: unzip -l packages/extension/*.vsix | grep -q 'extension/THIRD-PARTY-NOTICES.txt'
      # 配布物そのもの（束ねた JS・sourcemap・同梱文書）にも同じ走査を当てる
      - name: Scan the VSIX contents
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          unzip -q packages/extension/*.vsix -d "$d"
          (cd "$d" && find . -type f | sed 's|^\./||') > "$d.list"
          node scripts/release/scan-public-tree.mjs --root "$d" --list "$d.list"
      - name: Checksums
        run: cd packages/extension && sha256sum *.vsix > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: |
            packages/extension/*.vsix
            packages/extension/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GitHub Release を作る
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: vsix
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish vsix/*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Publish to VS Marketplace
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: GitHub Release
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sed -n "/^## $v/,/^## /p" CHANGELOG.md | sed '$d' > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" vsix/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
