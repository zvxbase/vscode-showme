name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小権限: どのジョブも repo を読むだけ（push / comment / deploy はしない）
permissions:
  contents: read

# 新しい push が来たら古い実行を止める（無料枠の分を積み上げない）
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks が履歴を見る
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # 公開ツリーに作業ディレクトリ・ホーム・セッション URL・メール・私設 IP が無いこと
      - run: node scripts/release/scan-public-tree.mjs
      - name: gitleaks (pinned binary, no third-party action)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact -v --log-opts="--all"
      - run: npm run build
      # 配布物が作れること（VSIX を作るのは release だけだが、壊れているのは今知りたい）
      - run: npm run -w packages/extension package
      # 束ねた第三者パッケージの表示が配布物に入っていること（MIT / ISC / BSD の条件）。
      # 一覧は esbuild.mjs が束ねた中身から生成し、許可外のライセンスならビルドが止まる
      - name: VSIX carries THIRD-PARTY-NOTICES.txt
        run: unzip -l packages/extension/*.vsix | grep -q 'extension/THIRD-PARTY-NOTICES.txt'
      # 配布物そのもの（束ねた JS・sourcemap・同梱文書）にも同じ走査を当てる
      - name: Scan the VSIX contents
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          unzip -q packages/extension/*.vsix -d "$d"
          (cd "$d" && find . -type f | sed 's|^\./||') > "$d.list"
          node scripts/release/scan-public-tree.mjs --root "$d" --list "$d.list"
      # クライアント非依存の1層目: 独立した MCP クライアントから 10 本のツールが見えること
      - name: MCP Inspector smoke (tools/list = 10)
        run: |
          set -euo pipefail
          n=$(npx --yes @modelcontextprotocol/inspector@2.6.0 --cli \
                node packages/extension/bridge/index.js \
                --method tools/list --format json --connect-timeout 15000 \
              | jq '.result.tools | length')
          echo "tools/list returned $n tool(s)"
          test "$n" -eq 10

  integration-linux:
    # 重い。PR と手動のときだけ走らせる（push: main では PR で既に測ってある）
    if: github.event_name != 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [test:integration, test:integration:two-windows, test:integration:locale-ja]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SHOWME_SOCK は制限モードと tmux で死ぬ経路なので、CI では必ず外して走らせる
      - run: env -u SHOWME_SOCK npm run -w packages/extension ${{ matrix.suite }}:xvfb

  # Windows の単体も門である（2026-09-28 から）。ネイティブの Windows では実行時ディレクトリを
  # DACL で確かめて（icacls）ソケットサーバを立てる。ソケットサーバ・登録・ハンドシェイクの検査は
  # Windows でも走り、POSIX の権限（0700 / 0600）の検査だけを飛ばす。本物の icacls / whoami を
  # 使う検査は Windows でだけ走る。
  unit-windows:
    if: github.event_name != 'push'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck（tsc --build）が packages/*/dist を作る。これを飛ばすと
      # @zvx/... の main が解決できず、テストファイルが「0 test」で静かに落ちる（実測）
      - run: npm run typecheck
      - run: npm run test

  integration-windows:
    # 信頼・制限の2回を Linux と同じく走らせる（runTest.ts）。信頼の回では、それに加えて
    # 「実行時ディレクトリの DACL が本人と trusted だけ」を確かめる（suite/windows.test.ts）。
    if: github.event_name != 'push'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 拡張は TEMP の DACL を確かめ、他の利用者が中に作れる TEMP では立たない（D104）。
      # runner.temp（D:\a\_temp）はドライブの根の既定を継いで Users に作成（AD / WD）を許しているので
      # （実測）、拡張は断る。自分だけが書けるフォルダを作り、拡張と同じ lockPrivateDir で締めて
      # （所有者を本人にし、継承を切って本人と SYSTEM だけ）、TMP / TEMP をそこへ向ける。
      # 締める前の runner.temp の DACL と、締めた後の SDDL はログに残す。
      - name: 自分だけが書ける TEMP を用意する
        shell: bash
        run: |
          icacls "$RUNNER_TEMP"
          npx tsc --build packages/protocol
          node -e '
            const p = require("./packages/protocol/dist/index.js");
            const dir = require("node:path").join(process.env.RUNNER_TEMP, "showme-tmp");
            require("node:fs").mkdirSync(dir);
            (async () => {
              const sid = await p.currentUserSid();
              await p.lockPrivateDir(dir, sid);
              const sddl = await p.readSddl(dir);
              const v = p.privateDirVerdict(sddl, sid);
              console.log(dir, sddl, JSON.stringify(v));
              if (!v.ok) process.exit(1);
            })().catch((e) => { console.error(e); process.exit(1); });
          '
      - run: npm run -w packages/extension test:integration
        shell: bash
        env:
          # RUNNER~1 の 8.3 短縮名を避ける（realpath と綴りの比較がこの repo の設計の要）。
          # runner コンテキストはステップ階層でしか使えない ―― ジョブ階層の env に書くと
          # ワークフロー自体が不正になり、ジョブが1つも作られないまま run が failure になる（実測）。
          TMP: ${{ runner.temp }}\showme-tmp
          TEMP: ${{ runner.temp }}\showme-tmp

  # macOS は private の repo では分を10倍に数えるので、手動実行（workflow_dispatch）のときだけ走らせる。
  # 公開 repo ではリリースの前に必ず手動実行し、この2つも緑であることを確かめる（D110）。
  unit-macos:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck が packages/*/dist を作る（飛ばすとテストファイルが「0 test」で落ちる）
      - run: npm run typecheck
      - run: npm run test

  integration-macos:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # macOS は画面があるので xvfb は要らない。SHOWME_SOCK は Linux と同じ理由で外す
      - run: env -u SHOWME_SOCK npm run -w packages/extension test:integration
